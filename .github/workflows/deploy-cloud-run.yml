name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Skip (don't fail) when the GCP service-account key isn't configured.
      # This stops noisy "All jobs have failed" emails on every push. Add the
      # GCP_SA_KEY repo secret to enable real deploys (see README / job notes).
      - name: Check for GCP credentials
        id: creds
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloud Run deploy skipped::GCP_SA_KEY secret is not set. Add it under Settings → Secrets and variables → Actions to enable automatic Cloud Run deploys."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - id: auth
        if: steps.creds.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.present == 'true'

      - name: Build and deploy
        if: steps.creds.outputs.present == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'realestate-map-23692' }}
        run: |
          gcloud builds submit --tag "gcr.io/${PROJECT_ID}/seller-map"
          gcloud run deploy seller-map \
            --image "gcr.io/${PROJECT_ID}/seller-map" \
            --platform managed \
            --region us-west1 \
            --allow-unauthenticated \
            --port 8080
