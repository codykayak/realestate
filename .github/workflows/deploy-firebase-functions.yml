name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build PM site knowledge for Gemini chat
        run: node scripts/build-pm-knowledge.mjs

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy functions and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret not set — skip deploy."
            exit 0
          fi
          firebase deploy --only functions,firestore:rules --project realestate-map-23692 --non-interactive
