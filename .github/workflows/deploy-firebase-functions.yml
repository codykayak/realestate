name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firebase-functions.yml'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'scripts/build-pm-knowledge.mjs'
      - 'src/property-management/content/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for GCP credentials
        id: creds
        env:
          # JSON service-account keys must not be interpolated into bash `[ -n ]` tests
          SA_JSON: ${{ secrets.PROJECTMANAGMENT }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "method=sa" >> "$GITHUB_OUTPUT"
          elif [ -n "$FB_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase deploy skipped::Set PROJECTMANAGMENT (recommended) or FIREBASE_TOKEN in GitHub Actions secrets."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.method != 'none'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.method != 'none'
        with:
          node-version: '20'

      - id: auth
        if: steps.creds.outputs.method == 'sa'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROJECTMANAGMENT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.method == 'sa'

      - name: Install Firebase CLI
        if: steps.creds.outputs.method != 'none'
        run: npm install -g firebase-tools@14.11.0

      - name: Build PM site knowledge for Gemini chat
        if: steps.creds.outputs.method != 'none'
        run: node scripts/build-pm-knowledge.mjs

      - name: Install function dependencies
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        run: npm ci

      - name: Verify functions entry loads
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        env:
          GEMINI_API_KEY: ci-smoke-test
        run: node -e "import('./index.js').then(() => console.log('functions index ok'))"

      - name: Deploy Cloud Functions (service account)
        if: steps.creds.outputs.method == 'sa'
        run: |
          echo "Deploying functions to realestate-map-23692"
          firebase deploy \
            --only functions \
            --project realestate-map-23692 \
            --non-interactive

      - name: Deploy Firestore rules (service account, optional)
        if: steps.creds.outputs.method == 'sa'
        continue-on-error: true
        run: |
          firebase deploy \
            --only firestore:rules \
            --project realestate-map-23692 \
            --non-interactive \
          || echo "::warning title=Firestore rules skipped::Service account needs Firebase Rules Admin on realestate-map-23692. Functions deploy is the critical path."

      - name: Deploy Cloud Functions (legacy token)
        if: steps.creds.outputs.method == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only functions \
            --project realestate-map-23692 \
            --non-interactive

      - name: Deploy Firestore rules (legacy token, optional)
        if: steps.creds.outputs.method == 'token'
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only firestore:rules \
            --project realestate-map-23692 \
            --non-interactive \
          || echo "::warning title=Firestore rules skipped::Regenerate FIREBASE_TOKEN or use PROJECTMANAGMENT service account."
