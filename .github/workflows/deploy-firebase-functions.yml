name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firebase-functions.yml'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'scripts/build-pm-knowledge.mjs'
      - 'src/property-management/content/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for GCP credentials
        id: creds
        env:
          # GitHub Actions secrets (JSON service-account keys via env — never inline in bash tests)
          # forfucksaketwofirestone → realestate-map-23692 (Map CMS /app, Twilio, pmGatewayChat)
          # forfucksake → property-managment (PM Firestore; reserved for future PM-only deploys)
          REALESTATE_SA: ${{ secrets.forfucksaketwofirestone }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$REALESTATE_SA" ]; then
            echo "method=sa" >> "$GITHUB_OUTPUT"
          elif [ -n "$FB_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase deploy skipped::Add GitHub secret forfucksaketwofirestone (realestate-map-23692 JSON key) or a valid FIREBASE_TOKEN."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.method != 'none'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.method != 'none'
        with:
          node-version: '20'

      - name: Validate realestate-map service account JSON
        id: sa_valid
        if: steps.creds.outputs.method == 'sa'
        env:
          REALESTATE_SA: ${{ secrets.forfucksaketwofirestone }}
        run: |
          if printf '%s' "$REALESTATE_SA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account'" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json,os; d=json.loads(os.environ['REALESTATE_SA']); print('Service account project_id:', d.get('project_id'))"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Invalid forfucksaketwofirestone::Re-paste the full JSON from Firebase → realestate-map-23692 → Service accounts → Generate new private key. Falling back to FIREBASE_TOKEN if set."
          fi

      - id: auth
        if: steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.forfucksaketwofirestone }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid == 'true'

      - name: Install Firebase CLI
        if: steps.creds.outputs.method != 'none'
        run: npm install -g firebase-tools@14.11.0

      - name: Build PM site knowledge for Gemini chat
        if: steps.creds.outputs.method != 'none'
        run: node scripts/build-pm-knowledge.mjs

      - name: Install function dependencies
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        run: npm ci

      - name: Verify functions entry loads
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        env:
          GEMINI_API_KEY: ci-smoke-test
        run: node -e "import('./index.js').then(() => console.log('functions index ok'))"

      - name: Deploy Cloud Functions (service account)
        if: steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid == 'true'
        run: |
          echo "Deploying functions to realestate-map-23692"
          firebase deploy --only functions --project realestate-map-23692 --non-interactive

      - name: Deploy Firestore rules (service account, optional)
        if: steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid == 'true'
        continue-on-error: true
        run: |
          firebase deploy --only firestore:rules --project realestate-map-23692 --non-interactive \
            || echo "::warning title=Firestore rules skipped::Rules deploy failed — functions deploy is the critical path."

      - name: Deploy Cloud Functions (legacy token)
        if: steps.creds.outputs.method == 'token' || (steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid != 'true')
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only functions --project realestate-map-23692 --non-interactive

      - name: Deploy Firestore rules (legacy token, optional)
        if: steps.creds.outputs.method == 'token' || (steps.creds.outputs.method == 'sa' && steps.sa_valid.outputs.valid != 'true')
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules --project realestate-map-23692 --non-interactive \
            || echo "::warning title=Firestore rules skipped::Regenerate FIREBASE_TOKEN with firebase login:ci if needed."
