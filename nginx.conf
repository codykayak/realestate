server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Behind Cloud Run / Google Frontend — avoid redirects to :8080 or http
    absolute_redirect off;
    port_in_redirect off;

    # SPA routing — serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PM moved to manydoorsai.com (301 for SEO; React redirect is fallback if this is bypassed)
    location ~ ^/property-management/?(.*)$ {
        return 301 https://www.manydoorsai.com/$1$is_args$args;
    }

    # Cache static assets aggressively; index.html never cached
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
